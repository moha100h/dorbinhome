version: "3.9"
services:
  bot:
    build: .
    container_name: dorbinhome_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot_data:
    name: dorbinhome_data
